name: Deploy static site to Pages

# Switched from the legacy branch-based Pages builder after it failed
# repeatedly with an unhelpful generic "Page build failed" error and no
# usable diagnostics. This workflow just uploads the repo root as-is (it's
# already plain static HTML/CSS/MD, no build step needed) and deploys via
# the standard actions/deploy-pages action, which gives real logs on failure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
