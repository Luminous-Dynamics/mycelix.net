version: '3.8'

services:
  mycelix-holochain:
    build: .
    container_name: mycelix-holochain
    ports:
      - "8765:8765"  # Gateway WebSocket
      - "8888:8888"  # Holochain App Interface
      - "4444:4444"  # Holochain Admin Interface
    volumes:
      - holochain-data:/app/holochain-data
      - lair-keystore:/app/lair-keystore
    environment:
      - RUST_LOG=info
      - HOLOCHAIN_CONDUCTOR_URL=ws://localhost:8888
      - HOLOCHAIN_APP_ID=mycelix
    networks:
      - mycelix-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mycelix-client:
    build: 
      context: ../client
      dockerfile: Dockerfile
    container_name: mycelix-client
    ports:
      - "3000:3000"
    environment:
      - VITE_GATEWAY_URL=ws://localhost:8765/ws
      - VITE_API_URL=http://localhost:8765
    depends_on:
      - mycelix-holochain
    networks:
      - mycelix-net
    restart: unless-stopped

  # Optional: Metrics collection with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: mycelix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mycelix-net
    restart: unless-stopped

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: mycelix-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mycelix
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - mycelix-net
    restart: unless-stopped

volumes:
  holochain-data:
  lair-keystore:
  prometheus-data:
  grafana-data:

networks:
  mycelix-net:
    driver: bridge