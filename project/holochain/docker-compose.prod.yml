version: '3.8'

# Production Docker Compose for Mycelix Holochain
# This runs the demo gateway until full Holochain implementation is ready

services:
  mycelix-gateway:
    image: node:20-alpine
    container_name: mycelix-gateway
    working_dir: /app
    volumes:
      - ./demo.sh:/app/demo.sh
      - gateway-data:/app/data
    ports:
      - "8765:8765"  # Gateway WebSocket
      - "8766:8766"  # Demo client HTTP
    environment:
      - NODE_ENV=production
      - RUST_LOG=info
    command: sh -c "apk add --no-cache python3 nodejs npm && sh /app/demo.sh"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mycelix-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: mycelix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static-files:/usr/share/nginx/html:ro
    depends_on:
      - mycelix-gateway
    networks:
      - mycelix-net
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: mycelix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - mycelix-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: mycelix-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-mycelix}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3000}
      - GF_SMTP_ENABLED=${SMTP_ENABLED:-false}
    depends_on:
      - prometheus
    networks:
      - mycelix-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  gateway-data:
    driver: local
  static-files:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  ssl-certs:
    driver: local

networks:
  mycelix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16