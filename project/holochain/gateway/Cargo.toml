[package]
name = "mycelix-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Holochain client
holochain_client = "0.4"
holochain_types = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# WebSocket and networking
tokio-tungstenite = "0.21"
futures-util = "0.3"

# CRDT implementation
# crdt = "7.0"  # Not available at this version
automerge = "0.5"  # Use automerge for CRDT functionality

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"  # Concurrent HashMap

# Resonance matching algorithms
nalgebra = "0.32"  # Linear algebra for pattern matching
rustfft = "6.1"    # FFT for frequency analysis

[dev-dependencies]
mockall = "0.12"
proptest = "1.4"